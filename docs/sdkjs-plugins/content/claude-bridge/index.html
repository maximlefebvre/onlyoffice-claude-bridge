<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Claude Bridge</title>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="asc-plugin-body">
  <div class="cb">
    <div class="cb-status">
      <span id="dot" class="dot dot-off"></span>
      <span id="status">Disconnected</span>
    </div>

    <label class="cb-label" for="port">Local port</label>
    <input id="port" class="form-control" type="number" value="47615">

    <label class="cb-label" for="token">Token</label>
    <input id="token" class="form-control" type="password" placeholder="Paste the server token" autocomplete="off">

    <div class="cb-actions">
      <button id="connect" class="btn-text-default">Connect</button>
      <button id="disconnect" class="btn-text-default">Disconnect</button>
    </div>

    <div class="cb-label">Log</div>
    <div id="log" class="cb-log"></div>
  </div>
  <script src="plugin.js?v=0.2.0"></script>
</body>
</html>

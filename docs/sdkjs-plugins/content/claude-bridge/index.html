<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Claude Bridge</title>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="asc-plugin-body">
  <div class="cb">
    <div class="cb-status">
      <span id="dot" class="dot dot-off"></span>
      <span id="status">Déconnecté</span>
    </div>

    <label class="cb-label" for="port">Port local</label>
    <input id="port" class="form-control" type="number" value="47615">

    <label class="cb-label" for="token">Jeton</label>
    <input id="token" class="form-control" type="password" placeholder="Coller le jeton du serveur" autocomplete="off">

    <div class="cb-actions">
      <button id="connect" class="btn-text-default">Connecter</button>
      <button id="disconnect" class="btn-text-default">Déconnecter</button>
    </div>

    <div class="cb-label">Journal</div>
    <div id="log" class="cb-log"></div>
  </div>
  <script src="plugin.js"></script>
</body>
</html>
